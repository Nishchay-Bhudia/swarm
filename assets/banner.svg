<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#1a1d24"/>
    </linearGradient>

    <linearGradient id="accentA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5f57"/>
      <stop offset="100%" stop-color="#ff9a3d"/>

    </linearGradient>
    <linearGradient id="accentB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d7bff"/>

      <stop offset="100%" stop-color="#3dd6ff"/>
    </linearGradient>
  </defs>


  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>


  <!-- crossed beams motif: two opposing lines meeting at center, echoing "conflicting objectives" -->
  <g opacity="0.9">
    <line x1="80" y1="230" x2="420" y2="70" stroke="url(#accentA)" stroke-width="6" stroke-linecap="round"/>

    <line x1="80" y1="70" x2="420" y2="230" stroke="url(#accentB)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="250" cy="150" r="10" fill="#f5f7fa"/>
  </g>


  <text x="470" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#f5f7fa" dominant-baseline="middle">SWARM</text>
  <text x="472" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#9aa3b2" dominant-baseline="middle">A multi-role engineering swarm for Claude Code</text>